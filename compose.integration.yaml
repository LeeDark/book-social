services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: book_social_test
      POSTGRES_USER: book_social
      POSTGRES_PASSWORD: book_social
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_social -d book_social_test"]
      interval: 2s
      timeout: 5s
      retries: 15
